name: assemble-journal-photos
on:
  push:
    paths:
      - journal/READY
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the journal photographs
        run: python3 journal/assemble.py
      - name: Commit the photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/cover.jpg journal/page-1.jpg journal/page-2.jpg journal/page-3.jpg journal/page-8.jpg journal/page-51.jpg
          if git diff --cached --quiet; then
            echo "no photo changes"
            exit 0
          fi
          git commit -m "Add journal photographs"
          git push
