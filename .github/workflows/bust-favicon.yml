name: bust-favicon
on:
  push:
    paths:
      - .github/workflows/bust-favicon.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the tab at the new icon
        run: |
          python3 - << 'PY'
          from pathlib import Path
          p = Path("index.html")
          t = p.read_text()
          old = '<link rel="icon" type="image/svg+xml" href="favicon.svg">'
          new = '<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">'
          if old not in t:
              raise SystemExit("pattern missing")
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh the tab icon"
          git push
